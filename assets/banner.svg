<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-label="Terminal banner: Haoliang Cheng, PhD Candidate, research focus AI Agent, open to work"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <clipPath id="f"><rect x="0" y="0" width="1000" height="300" rx="14"/></clipPath>
    <radialGradient id="g" cx="12%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#f)">
    <rect width="1000" height="300" fill="#000000"/>
    <rect y="36" width="1000" height="264" fill="url(#g)"/>
    <rect width="1000" height="36" fill="#161b22"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="13.5" fill="none" stroke="#30363d"/>
  <line x1="0" y1="36.5" x2="1000" y2="36.5" stroke="#30363d"/>

  <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/><circle cx="40" cy="18" r="5.5" fill="#ffbd2e"/><circle cx="58" cy="18" r="5.5" fill="#27c93f"/>
  <text x="76" y="23" fill="#8b949e" font-size="12.5">haoliang@github: ~/profile</text>
  <text x="976" y="23" fill="#484f58" font-size="12.5" text-anchor="end">zsh</text>

  <text x="28" y="80" font-size="18"><tspan fill="#39d353">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
  <text x="976" y="80" fill="#484f58" font-size="12" text-anchor="end"># identity</text>

  <text x="28" y="128" fill="#ffffff" font-size="42" font-weight="700">Haoliang Cheng</text>
  <rect x="389" y="97" width="11" height="33" fill="#39d353">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="28" y="178" font-size="18"><tspan fill="#39d353">$</tspan><tspan fill="#c9d1d9"> cat ~/.profile</tspan></text>
  <text x="976" y="178" fill="#484f58" font-size="12" text-anchor="end"># current status</text>

  <text x="28" y="210" font-size="19"><tspan fill="#8b949e">role   : </tspan><tspan fill="#ffffff" font-weight="700">PhD Candidate</tspan><tspan fill="#8b949e"> @ </tspan><tspan fill="#39d353">Nanjing University</tspan></text>
  <text x="28" y="240" font-size="19"><tspan fill="#8b949e">field  : </tspan><tspan fill="#ffffff" font-weight="700">AI Agent</tspan><tspan fill="#8b949e"> &#183; </tspan><tspan fill="#ffffff">Software Engineering</tspan></text>
  <text x="28" y="270" font-size="19"><tspan fill="#8b949e">status : </tspan><tspan fill="#ffffff" font-weight="700">Open to Work</tspan></text>
</svg>
