name: Refresh contribution graph

# Renders assets/contribution-graph.svg and commits it back to the repository.
# The data comes from a public read-only API, so no secrets are required.

on:
  schedule:
    - cron: "17 1 * * *"        # daily 01:17 UTC (= 09:17 Beijing time)
  workflow_dispatch:            # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/gen-contributions.mjs"

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render the SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/gen-contributions.mjs

      - name: Commit when the graph changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if git diff --staged --quiet; then
            echo "Graph unchanged - nothing to commit."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
